<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0b0d12">
    <title>Weekly Ranking</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236366f1'/%3E%3Cpath d='M9 22V13l7-4 7 4v9' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
          </span>
          <div>
            <p class="eyebrow">Weekly report</p>
            <h1>Ranking</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <span class="sync-state" id="sync-state"><span class="sync-dot"></span>Live from SQLite</span>
          <input id="csv-file" type="file" accept=".csv,text/csv" hidden>
          <button class="btn btn-primary" id="import-button" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
            Import CSV
          </button>
        </div>
      </header>

      <section class="stats" aria-label="Weekly overview">
        <article class="stat">
          <span class="stat-label">Players</span>
          <strong id="player-count">–</strong>
        </article>
        <article class="stat">
          <span class="stat-label">Leader</span>
          <strong id="leader-name">–</strong>
        </article>
        <article class="stat">
          <span class="stat-label">Weekly best</span>
          <strong class="accent" id="leader-points">–</strong>
        </article>
        <article class="stat">
          <span class="stat-label">Last import</span>
          <strong class="small" id="updated-at">–</strong>
        </article>
      </section>

      <section class="podium" id="podium" aria-label="Top 3" hidden></section>

      <section class="card" aria-label="Player ranking">
        <div class="toolbar">
          <div class="toolbar-title">
            <h2>Weekly standings</h2>
            <span class="target-pill">Daily target 2.3M</span>
          </div>
          <div class="toolbar-controls">
            <div class="segmented" id="filter" role="group" aria-label="Filter">
              <button type="button" data-filter="all" class="is-active">All</button>
              <button type="button" data-filter="warning">Warning</button>
              <button type="button" data-filter="remove">Removal</button>
            </div>
            <label class="search">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="search-input" type="search" placeholder="Search players" autocomplete="off" aria-label="Search players">
            </label>
          </div>
        </div>

        <div class="table-scroll" tabindex="0" aria-label="Scroll ranking horizontally">
          <table>
            <thead>
              <tr>
                <th class="col-rank">#</th>
                <th class="col-player">Player</th>
                <th class="col-day">Mon</th>
                <th class="col-day">Tue</th>
                <th class="col-day">Wed</th>
                <th class="col-day">Thu</th>
                <th class="col-day">Fri</th>
                <th class="col-day">Sat</th>
                <th class="col-total">Total</th>
                <th class="col-avg">Avg / day</th>
                <th class="col-crit">Days ≤ 2.3M</th>
                <th class="col-status">Status</th>
              </tr>
            </thead>
            <tbody id="player-rows">
              <tr><td class="loading-cell" colspan="12">Loading ranking …</td></tr>
            </tbody>
          </table>
          <div id="empty-state" class="empty-state" hidden>No matching players found.</div>
        </div>

        <footer class="card-footer">
          <span id="visible-count">–</span>
          <ul class="legend" aria-label="Legend">
            <li><i class="dot dot-good"></i>above target</li>
            <li><i class="dot dot-edge"></i>on target</li>
            <li><i class="dot dot-bad"></i>below target</li>
          </ul>
        </footer>
      </section>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
